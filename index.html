<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICON | Catálogo de Stock</title>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0d0d;
      color: #ffffff;
      margin: 0;
      padding-bottom: 40px;
      position: relative;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      max-width: 420px;
      height: 80vw;
      max-height: 420px;
      background-image: url('https://lh3.googleusercontent.com/d/1MTXUyzpXlZ3_ZqjanHdG8RTrHTJm-MBh');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.08;
      pointer-events: none;
      z-index: 0;
    }

    header {
      background-color: #000000;
      padding: 15px 10px 12px 10px;
      text-align: center;
      border-bottom: 1px solid #222;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }
    .logo {
      max-height: 85px;
      width: auto;
      max-width: 80vw;
      object-fit: contain;
      display: block;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 5px;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.85em;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-btn.active, .nav-btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .toolbar {
      max-width: 1000px;
      margin: 15px auto 0 auto;
      padding: 0 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .search-input {
      background: #141414;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9em;
      flex: 1 1 200px;
    }
    .search-input:focus { outline: none; border-color: #666; }
    .filter-select {
      background: #141414;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85em;
      cursor: pointer;
    }
    .filter-checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85em;
      color: #aaa;
      cursor: pointer;
      user-select: none;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      max-width: 1000px;
      margin: 15px auto;
      padding: 0 15px;
      position: relative;
      z-index: 1;
    }
    .card {
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(4px);
      border: 1px solid #222;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-2px); border-color: #444; }
    .title {
      font-weight: 700;
      font-size: 0.95em;
      margin-bottom: 6px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .talle-badge {
      display: inline-block;
      background: #252525;
      color: #e0e0e0;
      border: 1px solid #444;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.72em;
      font-weight: 600;
      margin-bottom: 8px;
      width: fit-content;
      letter-spacing: 0.5px;
    }
    .price {
      font-size: 1.2em;
      font-weight: bold;
      color: #4caf50;
      margin-bottom: 10px;
    }
    .status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75em;
      font-weight: bold;
      text-align: center;
      margin-bottom: 12px;
      width: fit-content;
    }

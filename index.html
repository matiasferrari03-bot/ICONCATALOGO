<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICON | Catálogo de Stock</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1MTXUyzpXlZ3_ZqjanHdG8RTrHTJm-MBh">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0d0d;
      color: #ffffff;
      margin: 0;
      padding-bottom: 40px;
      position: relative;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      max-width: 420px;
      height: 80vw;
      max-height: 420px;
      background-image: url('https://lh3.googleusercontent.com/d/1MTXUyzpXlZ3_ZqjanHdG8RTrHTJm-MBh');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.08;
      pointer-events: none;
      z-index: 0;
    }

    header {
      background-color: #000000;
      padding: 15px 10px 12px 10px;
      text-align: center;
      border-bottom: 1px solid #222;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }
    .logo {
      max-height: 85px;
      width: auto;
      max-width: 80vw;
      object-fit: contain;
      display: block;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 5px;
    }
    .nav-btn {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      padding: 8px 24px;
      border-radius: 20px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.85em;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-btn.active, .nav-btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
      position: relative;
      z-index: 1;
    }
    .card {
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(4px);
      border: 1px solid #222;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #444;
    }
    .title {
      font-weight: 700;
      font-size: 0.95em;
      margin-bottom: 8px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .price {
      font-size: 1.2em;
      font-weight: bold;
      color: #4caf50;
      margin-bottom: 10px;
    }
    .status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75em;
      font-weight: bold;
      text-align: center;
      margin-bottom: 12px;
      width: fit-content;
    }
    .in-stock { background-color: rgba(76, 175, 80, 0.15); color: #4caf50; border: 1px solid rgba(76, 175, 80, 0.3); }
    .out-stock { background-color: rgba(244, 67, 54, 0.15); color: #f44336; border: 1px solid rgba(244, 67, 54, 0.3); }
    .btn-ws {
      display: block;
      text-align: center;
      background-color: #25d366;
      color: #ffffff;
      text-decoration: none;
      padding: 9px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85em;
      transition: background-color 0.2s;
    }
    .btn-ws:hover { background-color: #1ebd56; }
    .loading { text-align: center; color: #888; margin-top: 40px; font-size: 1em; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1_LgUzOOjiZpsB0xAQB_VwP06Qdctmv7R" alt="ICON Indumentaria & Accesorios" class="logo" onerror="this.style.display='none'; document.getElementById('alt-title').style.display='block';">
      <h1 id="alt-title" style="display:none; margin:0; letter-spacing:2px; font-size: 1.6em;">ICON</h1>
    </div>
    
    <nav>
      <button class="nav-btn active" id="btn-gorras" onclick="loadCategory('GORRAS')">Gorras</button>
      <button class="nav-btn" id="btn-remeras" onclick="loadCategory('REMERAS')">Remeras</button>
    </nav>
  </header>

  <div id="catalog" class="container">
    <div class="loading">Cargando productos en vivo...</div>
  </div>

  <script>
    var API_URL = 'https://script.google.com/macros/s/AKfycbx-GaEgu6_oVhr2rd-CchSSXYWOZkd_w2wWgGCaaTRHirHLeomdBYFKZTQ74sTVcX2YkQ/exec';

    function renderProducts(lista) {
      var container = document.getElementById('catalog');
      if (!lista || lista.length === 0) {
        container.innerHTML = '<div class="loading">No hay productos disponibles en esta categoría.</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < lista.length; i++) {
        var p = lista[i];
        var statusClass = p.disponible ? 'in-stock' : 'out-stock';
        var statusText = p.disponible ? 'Disponible' : 'Sin Stock';
        var precioTexto = p.precio ? '$' + Number(p.precio).toLocaleString('es-AR') : 'Consultar';
        var wsLink = 'https://wa.me/5491123610813?text=' + encodeURIComponent('Hola! Me interesa ' + p.modelo);

        html += '<div class="card">' +
                  '<div>' +
                    '<div class="title">' + p.modelo + '</div>' +
                    '<div class="price">' + precioTexto + '</div>' +
                    '<div class="status ' + statusClass + '">' + statusText + '</div>' +
                  '</div>' +
                  (p.disponible ? '<a href="' + wsLink + '" target="_blank" class="btn-ws">Pedir por WhatsApp</a>' : '') +
                '</div>';
      }
      container.innerHTML = html;
    }

    function loadCategory(cat) {
      var btnG = document.getElementById('btn-gorras');
      var btnR = document.getElementById('btn-remeras');

      if (cat === 'GORRAS') {
        btnG.classList.add('active');
        btnR.classList.remove('active');
      } else {
        btnR.classList.add('active');
        btnG.classList.remove('active');
      }

      document.getElementById('catalog').innerHTML = '<div class="loading">Cargando ' + cat.toLowerCase() + '...</div>';

      var cbName = 'cb_' + Date.now();
      window[cbName] = function(res) {
        if (res && Array.isArray(res)) {
          renderProducts(res);
        } else {
          document.getElementById('catalog').innerHTML = '<div class="loading">No se pudieron obtener los productos.</div>';
        }
        delete window[cbName];
        var s = document.getElementById(cbName);
        if (s && s.parentNode) s.parentNode.removeChild(s);
      };

      var script = document.createElement('script');
      script.id = cbName;
      script.src = API_URL + '?category=' + encodeURIComponent(cat) + '&callback=' + cbName;
      script.onerror = function() {
        document.getElementById('catalog').innerHTML = '<div class="loading">Error al conectar con la planilla de datos.</div>';
      };
      document.body.appendChild(script);
    }

    loadCategory('GORRAS');
  </script>
</body>
</html>

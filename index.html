<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICON | Catálogo de Stock</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1MTXUyzpXlZ3_ZqjanHdG8RTrHTJm-MBh">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0d0d;
      color: #ffffff;
      margin: 0;
      padding-bottom: 40px;
      position: relative;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      max-width: 420px;
      height: 80vw;
      max-height: 420px;
      background-image: url('https://lh3.googleusercontent.com/d/1MTXUyzpXlZ3_ZqjanHdG8RTrHTJm-MBh');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.08;
      pointer-events: none;
      z-index: 0;
    }

    header {
      background-color: #000000;
      padding: 15px 10px 12px 10px;
      text-align: center;
      border-bottom: 1px solid #222;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }
    .logo {
      max-height: 85px;
      width: auto;
      max-width: 80vw;
      object-fit: contain;
      display: block;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 5px;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.85em;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-btn.active, .nav-btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .toolbar {
      max-width: 1000px;
      margin: 15px auto 0 auto;
      padding: 0 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .search-input {
      background: #141414;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9em;
      flex: 1 1 200px;
    }
    .search-input:focus { outline: none; border-color: #666; }
    .filter-select {
      background: #141414;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85em;
      cursor: pointer;
    }
    .filter-checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85em;
      color: #aaa;
      cursor: pointer;
      user-select: none;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      max-width: 1000px;
      margin: 15px auto;
      padding: 0 15px;
      position: relative;
      z-index: 1;
    }
    .card {
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(4px);
      border: 1px solid #222;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-2px); border-color: #444; }
    .title {
      font-weight: 700;
      font-size: 0.95em;
      margin-bottom: 6px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .talle-badge {
      display: inline-block;
      background: #252525;
      color: #e0e0e0;
      border: 1px solid #444;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.72em;
      font-weight: 600;
      margin-bottom: 8px;
      width: fit-content;
      letter-spacing: 0.5px;
    }
    .price {
      font-size: 1.2em;
      font-weight: bold;
      color: #4caf50;
      margin-bottom: 10px;
    }
    .status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75em;
      font-weight: bold;
      text-align: center;
      margin-bottom: 12px;
      width: fit-content;
    }
    .in-stock { background-color: rgba(76, 175, 80, 0.15); color: #4caf50; border: 1px solid rgba(76, 175, 80, 0.3); }
    .out-stock { background-color: rgba(244, 67, 54, 0.15); color: #f44336; border: 1px solid rgba(244, 67, 54, 0.3); }
    .btn-ws {
      display: block;
      text-align: center;
      background-color: #25d366;
      color: #ffffff;
      text-decoration: none;
      padding: 9px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85em;
      transition: background-color 0.2s;
    }
    .btn-ws:hover { background-color: #1ebd56; }
    .loading { text-align: center; color: #888; margin-top: 40px; font-size: 1em; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1_LgUzOOjiZpsB0xAQB_VwP06Qdctmv7R" alt="ICON Indumentaria & Accesorios" class="logo" onerror="this.style.display='none'; document.getElementById('alt-title').style.display='block';">
      <h1 id="alt-title" style="display:none; margin:0; letter-spacing:2px; font-size: 1.6em;">ICON</h1>
    </div>
    
    <nav>
      <button class="nav-btn active" id="btn-gorras" onclick="loadCategory('GORRAS')">Gorras</button>
      <button class="nav-btn" id="btn-remeras" onclick="loadCategory('REMERAS')">Remeras</button>
      <button class="nav-btn" id="btn-accesorios" onclick="loadCategory('ACCESORIOS')">Accesorios</button>
    </nav>
  </header>

  <div class="toolbar">
    <input type="text" id="search-box" class="search-input" placeholder="Buscar modelo..." oninput="applyFilters()">
    
    <select id="sort-select" class="filter-select" onchange="applyFilters()">
      <option value="default">Orden por defecto</option>
      <option value="asc">Precio: Menor a Mayor</option>
      <option value="desc">Precio: Mayor a Menor</option>
    </select>

    <label class="filter-checkbox">
      <input type="checkbox" id="only-stock" onchange="applyFilters()"> Solo con Stock
    </label>
  </div>

  <div id="catalog" class="container">
    <div class="loading">Cargando catálogo en vivo...</div>
  </div>

  <script>
    var SHEET_ID = '1Qe2LG3pDsM536gB0ue44uYTaruYri9FwGIYylcoW7rU';
    var currentCategory = 'GORRAS';
    var rawProducts = [];

    // Base inicial inmediata para que la pantalla NUNCA se quede en negro
    var fallbackData = {
      'GORRAS': [
        { modelo: 'GORRA NY NEGRA', precio: 81840, disponible: true, talle: '' },
        { modelo: 'GORRA P GRIS', precio: 78120, disponible: true, talle: '' },
        { modelo: 'GORRA LA', precio: 74400, disponible: true, talle: '' },
        { modelo: 'GORRA JORDAN FRANJA ROJA', precio: 74400, disponible: true, talle: '' },
        { modelo: 'JORDAN CHAPITA', precio: 65100, disponible: true, talle: '' },
        { modelo: 'JORDAN CLASICA', precio: 65100, disponible: true, talle: '' },
        { modelo: 'CLUB NIKE', precio: 78120, disponible: true, talle: '' },
        { modelo: 'NIKE B NEGRA', precio: 66960, disponible: true, talle: '' },
        { modelo: 'WARRIORS NIKE', precio: 66960, disponible: true, talle: '' },
        { modelo: 'JORDAN CLASICA PLANA', precio: 78120, disponible: false, talle: '' },
        { modelo: 'GORRA CELTIC', precio: 66960, disponible: false, talle: '' },
        { modelo: 'NIKE CHAPITA', precio: 65100, disponible: false, talle: '' },
        { modelo: 'LOS ANGELES', precio: 81840, disponible: false, talle: '' },
        { modelo: 'T ROJA', precio: 78120, disponible: false, talle: '' }
      ],
      'REMERAS': [
        { modelo: 'REMRA FLYG JORDAN BLANCA', precio: 55000, disponible: true, talle: 'M' },
        { modelo: 'REMRA FLYG NEGRA', precio: 55000, disponible: true, talle: 'M' },
        { modelo: 'REMRA BRASIL', precio: 59000, disponible: true, talle: 'M' },
        { modelo: 'REMRA FRANCIA', precio: 61000, disponible: true, talle: 'M' },
        { modelo: 'REMRA BLANJA AJ1', precio: 63000, disponible: false, talle: 'M' },
        { modelo: 'JORDAN AZUL', precio: 66000, disponible: false, talle: 'M' },
        { modelo: 'REMRA JORDAN NEGRA CLASICA', precio: 70000, disponible: false, talle: 'M' },
        { modelo: 'REMRA CLASICA GRIS JORDAN', precio: 70000, disponible: false, talle: 'M' },
        { modelo: 'REMRA JORDAN BROONKLIN', precio: 63000, disponible: false, talle: 'M' },
        { modelo: 'REMERA NIKE AIR MAX', precio: 55000, disponible: false, talle: 'M' },
        { modelo: 'REMRA BRRON TALLE L', precio: 76000, disponible: false, talle: 'M' },
        { modelo: 'REMERA LACOSTE', precio: 82000, disponible: true, talle: 'M' }
      ],
      'ACCESORIOS': [
        { modelo: 'OJOTA LACOSTE', precio: 69000, disponible: true, talle: '' },
        { modelo: 'COLGANTE JORDAN', precio: 33000, disponible: true, talle: '' },
        { modelo: 'BOLSO JORDAN AIR', precio: 65000, disponible: true, talle: '' }
      ]
    };

    function applyFilters() {
      var searchVal = document.getElementById('search-box').value.toLowerCase().trim();
      var sortVal = document.getElementById('sort-select').value;
      var onlyStockVal = document.getElementById('only-stock').checked;

      var filtered = rawProducts.filter(function(p) {
        var matchesText = p.modelo.toLowerCase().includes(searchVal);
        var matchesStock = onlyStockVal ? p.disponible : true;
        return matchesText && matchesStock;
      });

      if (sortVal === 'asc') {
        filtered.sort(function(a, b) { return Number(a.precio) - Number(b.precio); });
      } else if (sortVal === 'desc') {
        filtered.sort(function(a, b) { return Number(b.precio) - Number(a.precio); });
      }

      renderProducts(filtered);
    }

    function renderProducts(lista) {
      var container = document.getElementById('catalog');
      if (!lista || lista.length === 0) {
        container.innerHTML = '<div class="loading">No hay productos disponibles en esta categoría.</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < lista.length; i++) {
        var p = lista[i];
        var statusClass = p.disponible ? 'in-stock' : 'out-stock';
        var statusText = p.disponible ? 'Disponible' : 'Sin Stock';
        var precioTexto = p.precio ? '$' + Number(p.precio).toLocaleString('es-AR') : 'Consultar';
        
        var talleHtml = p.talle ? '<div class="talle-badge">Talle: ' + p.talle + '</div>' : '';
        var textWs = 'Hola! Me interesa ' + p.modelo + (p.talle ? ' (Talle ' + p.talle + ')' : '');
        var wsLink = 'https://wa.me/5491123610813?text=' + encodeURIComponent(textWs);

        html += '<div class="card">' +
                  '<div>' +
                    '<div class="title">' + p.modelo + '</div>' +
                    talleHtml +
                    '<div class="price">' + precioTexto + '</div>' +
                    '<div class="status ' + statusClass + '">' + statusText + '</div>' +
                  '</div>' +
                  (p.disponible ? '<a href="' + wsLink + '" target="_blank" class="btn-ws">Pedir por WhatsApp</a>' : '') +
                '</div>';
      }
      container.innerHTML = html;
    }

    function parseCSVLine(line) {
      var result = [];
      var cur = '';
      var inQuotes = false;
      for (var i = 0; i < line.length; i++) {
        var c = line[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cur);
          cur = '';
        } else {
          cur += c;
        }
      }
      result.push(cur);
      return result;
    }

    function loadCategory(sheetName) {
      currentCategory = sheetName;
      var buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(function(b) { b.classList.remove('active'); });

      var activeBtn = document.getElementById('btn-' + sheetName.toLowerCase());
      if (activeBtn) activeBtn.classList.add('active');

      // 1. Mostrar de inmediato los productos sin demora
      rawProducts = fallbackData[sheetName] || [];
      applyFilters();

      // 2. Traer en segundo plano las actualizaciones de Google Sheets
      var csvUrl = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(sheetName) + "&_t=" + Date.now();

      fetch(csvUrl, { cache: "no-store" })
        .then(function(res) { return res.text(); })
        .then(function(text) {
          var lines = text.split(/\r\n|\n/);
          var list = [];

          for (var i = 0; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            var cols = parseCSVLine(lines[i]);

            var modelo = cols[0] ? cols[0].replace(/^"|"$/g, '').trim() : '';
            var precioRaw = cols[5] ? cols[5].replace(/^"|"$/g, '').trim() : '0';
            var stockRaw = cols[6] ? cols[6].replace(/^"|"$/g, '').trim().toUpperCase() : 'FALSE';
            
            // Solo toma la columna H (Índice 7) para REMERAS
            var talleRaw = '';
            if (sheetName === 'REMERAS' && cols[7]) {
              talleRaw = cols[7].replace(/^"|"$/g, '').trim();
            }

            if (!modelo || 
                modelo.toUpperCase().startsWith('HTTP') || 
                modelo.toUpperCase().includes('MODELO') || 
                modelo.toUpperCase().includes('STOCK DE') ||
                modelo.toUpperCase().includes('IMAGEN Y MODELO')) {
              continue;
            }

            var precioNum = Number(precioRaw.replace(/[^0-9]/g, '')) || 0;
            var esDisponible = (stockRaw === 'TRUE' || stockRaw === 'VERDADERO' || stockRaw === 'SI' || stockRaw === '1');

            list.push({
              modelo: modelo,
              precio: precioNum,
              disponible: esDisponible,
              talle: talleRaw
            });
          }

          if (list.length > 0 && currentCategory === sheetName) {
            rawProducts = list;
            applyFilters();
          }
        })
        .catch(function(err) {
          // Si hay algún problema momentáneo con internet, mantiene en pantalla los datos de respaldo
        });
    }

    loadCategory('GORRAS');
  </script>
</body>
</html>

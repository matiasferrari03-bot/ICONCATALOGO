<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICON | Catálogo de Stock</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1MTXUyzpXlZ3_ZqjanHdG8RTrHTJm-MBh">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0d0d;
      color: #ffffff;
      margin: 0;
      padding-bottom: 40px;
      position: relative;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      max-width: 420px;
      height: 80vw;
      max-height: 420px;
      background-image: url('https://lh3.googleusercontent.com/d/1MTXUyzpXlZ3_ZqjanHdG8RTrHTJm-MBh');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.08;
      pointer-events: none;
      z-index: 0;
    }

    header {
      background-color: #000000;
      padding: 15px 10px 12px 10px;
      text-align: center;
      border-bottom: 1px solid #222;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }
    .logo {
      max-height: 85px;
      width: auto;
      max-width: 80vw;
      object-fit: contain;
      display: block;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 5px;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.85em;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-btn.active, .nav-btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .toolbar {
      max-width: 1000px;
      margin: 15px auto 0 auto;
      padding: 0 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .search-input {
      background: #141414;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9em;
      flex: 1 1 200px;
    }
    .search-input:focus { outline: none; border-color: #666; }
    .filter-select {
      background: #141414;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85em;
      cursor: pointer;
    }
    .filter-checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85em;
      color: #aaa;
      cursor: pointer;
      user-select: none;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      max-width: 1000px;
      margin: 15px auto;
      padding: 0 15px;
      position: relative;
      z-index: 1;
    }
    .card {
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(4px);
      border: 1px solid #222;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-2px); border-color: #444; }

    /* Imagen cuadrada adaptativa */
    .img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      height: auto;
      background: #161616;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .card:hover .img-wrap img {
      transform: scale(1.04);
    }
    .img-wrap .placeholder-logo {
      width: 50%;
      height: auto;
      opacity: 0.35;
      object-fit: contain;
    }

    /* Controles de slider para múltiples imágenes */
    .slide-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: #ffffff;
      font-size: 14px;
      padding: 6px 9px;
      cursor: pointer;
      border-radius: 4px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .slide-arrow:hover { background: rgba(0, 0, 0, 0.9); }
    .slide-arrow.prev { left: 6px; }
    .slide-arrow.next { right: 6px; }
    
    .dots-wrap {
      position: absolute;
      bottom: 6px;
      display: flex;
      gap: 5px;
      z-index: 2;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: background 0.2s;
    }
    .dot.active {
      background: #ffffff;
      width: 14px;
      border-radius: 3px;
    }

    .title {
      font-weight: 700;
      font-size: 0.95em;
      margin-bottom: 6px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .talle-badge {
      display: inline-block;
      background: #252525;
      color: #e0e0e0;
      border: 1px solid #444;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.72em;
      font-weight: 600;
      margin-bottom: 8px;
      width: fit-content;
      letter-spacing: 0.5px;
    }
    .price {
      font-size: 1.2em;
      font-weight: bold;
      color: #4caf50;
      margin-bottom: 10px;
    }
    .status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75em;
      font-weight: bold;
      text-align: center;
      margin-bottom: 12px;
      width: fit-content;
    }
    .in-stock { background-color: rgba(76, 175, 80, 0.15); color: #4caf50; border: 1px solid rgba(76, 175, 80, 0.3); }
    .out-stock { background-color: rgba(244, 67, 54, 0.15); color: #f44336; border: 1px solid rgba(244, 67, 54, 0.3); }
    .btn-ws {
      display: block;
      text-align: center;
      background-color: #25d366;
      color: #ffffff;
      text-decoration: none;
      padding: 9px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85em;
      transition: background-color 0.2s;
    }
    .btn-ws:hover { background-color: #1ebd56; }
    .loading { text-align: center; color: #888; margin-top: 40px; font-size: 1em; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1_LgUzOOjiZpsB0xAQB_VwP06Qdctmv7R" alt="ICON Indumentaria & Accesorios" class="logo" onerror="this.style.display='none'; document.getElementById('alt-title').style.display='block';">
      <h1 id="alt-title" style="display:none; margin:0; letter-spacing:2px; font-size: 1.6em;">ICON</h1>
    </div>
    
    <nav>
      <button class="nav-btn active" id="btn-gorras" onclick="loadCategory('GORRAS')">Gorras</button>
      <button class="nav-btn" id="btn-remeras" onclick="loadCategory('REMERAS')">Remeras</button>
      <button class="nav-btn" id="btn-accesorios" onclick="loadCategory('ACCESORIOS')">Accesorios</button>
    </nav>
  </header>

  <div class="toolbar">
    <input type="text" id="search-box" class="search-input" placeholder="Buscar modelo..." oninput="applyFilters()">
    
    <select id="sort-select" class="filter-select" onchange="applyFilters()">
      <option value="default">Orden por defecto</option>
      <option value="asc">Precio: Menor a Mayor</option>
      <option value="desc">Precio: Mayor a Menor</option>
    </select>

    <label class="filter-checkbox">
      <input type="checkbox" id="only-stock" onchange="applyFilters()"> Solo con Stock
    </label>
  </div>

  <div id="catalog" class="container">
    <div class="loading">Cargando catálogo en vivo...</div>
  </div>

  <script>
    var SHEET_ID = '1Qe2LG3pDsM536gB0ue44uYTaruYri9FwGIYylcoW7rU';
    var APPSHEET_APP_ID = 'ICONSTOCK-663975856';
    var DEFAULT_LOGO = 'https://lh3.googleusercontent.com/d/1_LgUzOOjiZpsB0xAQB_VwP06Qdctmv7R';
    var currentCategory = 'GORRAS';
    var rawProducts = [];

    function formatImageUrl(val, sheetName) {
      if (!val) return null;
      val = val.trim();

      var driveMatch = val.match(/\/d\/([a-zA-Z0-9_-]+)/) || val.match(/id=([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        return 'https://lh3.googleusercontent.com/d/' + driveMatch[1];
      }

      if (val.startsWith('http://') || val.startsWith('https://')) {
        return val;
      }

      if (val.includes('/') || val.endsWith('.jpg') || val.endsWith('.png') || val.endsWith('.jpeg')) {
        return 'https://www.appsheet.com/template/gettablefileurl?appName=' + 
               encodeURIComponent(APPSHEET_APP_ID) + 
               '&tableName=' + encodeURIComponent(sheetName) + 
               '&fileName=' + encodeURIComponent(val);
      }

      return null;
    }

    function applyFilters() {
      var searchVal = document.getElementById('search-box').value.toLowerCase().trim();
      var sortVal = document.getElementById('sort-select').value;
      var onlyStockVal = document.getElementById('only-stock').checked;

      var filtered = rawProducts.filter(function(p) {
        var matchesText = p.modelo.toLowerCase().includes(searchVal);
        var matchesStock = onlyStockVal ? p.disponible : true;
        return matchesText && matchesStock;
      });

      if (sortVal === 'asc') {
        filtered.sort(function(a, b) { return Number(a.precio) - Number(b.precio); });
      } else if (sortVal === 'desc') {
        filtered.sort(function(a, b) { return Number(b.precio) - Number(a.precio); });
      }

      renderProducts(filtered);
    }

    function changeSlide(prodIndex, direction, event) {
      if (event) event.stopPropagation();
      var p = rawProducts[prodIndex];
      if (!p || !p.imagenes || p.imagenes.length <= 1) return;

      p.activeSlide = (p.activeSlide + direction + p.imagenes.length) % p.imagenes.length;
      
      var imgEl = document.getElementById('img-' + prodIndex);
      if (imgEl) imgEl.src = p.imagenes[p.activeSlide];

      var dots = document.querySelectorAll('#dots-' + prodIndex + ' .dot');
      dots.forEach(function(dot, idx) {
        if (idx === p.activeSlide) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });
    }

    function setSlide(prodIndex, slideIndex, event) {
      if (event) event.stopPropagation();
      var p = rawProducts[prodIndex];
      if (!p || !p.imagenes || slideIndex >= p.imagenes.length) return;

      p.activeSlide = slideIndex;
      var imgEl = document.getElementById('img-' + prodIndex);
      if (imgEl) imgEl.src = p.imagenes[p.activeSlide];

      var dots = document.querySelectorAll('#dots-' + prodIndex + ' .dot');
      dots.forEach(function(dot, idx) {
        if (idx === p.activeSlide) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });
    }

    function renderProducts(lista) {
      var container = document.getElementById('catalog');
      if (!lista || lista.length === 0) {
        container.innerHTML = '<div class="loading">No hay productos disponibles en esta categoría.</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < lista.length; i++) {
        var p = lista[i];
        var originalIndex = rawProducts.indexOf(p);
        var statusClass = p.disponible ? 'in-stock' : 'out-stock';
        var statusText = p.disponible ? 'Disponible' : 'Sin Stock';
        var precioTexto = p.precio ? '$' + Number(p.precio).toLocaleString('es-AR') : 'Consultar';
        var talleHtml = p.talle ? '<div class="talle-badge">Talle: ' + p.talle + '</div>' : '';
        var textWs = 'Hola! Me interesa ' + p.modelo + (p.talle ? ' (Talle ' + p.talle + ')' : '');
        var wsLink = 'https://wa.me/5491123610813?text=' + encodeURIComponent(textWs);

        var hasMultiple = p.imagenes && p.imagenes.length > 1;
        var currentImgSrc = (p.imagenes && p.imagenes.length > 0) ? p.imagenes[p.activeSlide || 0] : DEFAULT_LOGO;

        var controlsHtml = '';
        if (hasMultiple) {
          controlsHtml += '<button class="slide-arrow prev" onclick="changeSlide(' + originalIndex + ', -1, event)">&#10094;</button>';
          controlsHtml += '<button class="slide-arrow next" onclick="changeSlide(' + originalIndex + ', 1, event)">&#10095;</button>';
          controlsHtml += '<div class="dots-wrap" id="dots-' + originalIndex + '">';
          for (var d = 0; d < p.imagenes.length; d++) {
            var activeClass = d === (p.activeSlide || 0) ? ' active' : '';
            controlsHtml += '<span class="dot' + activeClass + '" onclick="setSlide(' + originalIndex + ', ' + d + ', event)"></span>';
          }
          controlsHtml += '</div>';
        }

        var imgHtml = (p.imagenes && p.imagenes.length > 0)
          ? '<img id="img-' + originalIndex + '" src="' + currentImgSrc + '" alt="' + p.modelo + '" onerror="this.onerror=null; this.src=\'' + DEFAULT_LOGO + '\'; this.className=\'placeholder-logo\';">'
          : '<img src="' + DEFAULT_LOGO + '" alt="ICON" class="placeholder-logo">';

        html += '<div class="card">' +
                  '<div>' +
                    '<div class="img-wrap">' +
                      imgHtml +
                      controlsHtml +
                    '</div>' +
                    '<div class="title">' + p.modelo + '</div>' +
                    talleHtml +
                    '<div class="price">' + precioTexto + '</div>' +
                    '<div class="status ' + statusClass + '">' + statusText + '</div>' +
                  '</div>' +
                  (p.disponible ? '<a href="' + wsLink + '" target="_blank" class="btn-ws">Pedir por WhatsApp</a>' : '') +
                '</div>';
      }
      container.innerHTML = html;
    }

    function parseCSVLine(line) {
      var result = [];
      var cur = '';
      var inQuotes = false;
      for (var i = 0; i < line.length; i++) {
        var c = line[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cur);
          cur = '';
        } else {
          cur += c;
        }
      }
      result.push(cur);
      return result;
    }

    function loadCategory(sheetName) {
      currentCategory = sheetName;
      var buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(function(b) { b.classList.remove('active'); });

      var activeBtn = document.getElementById('btn-' + sheetName.toLowerCase());
      if (activeBtn) activeBtn.classList.add('active');

      document.getElementById('catalog').innerHTML = '<div class="loading">Sincronizando ' + sheetName.toLowerCase() + '...</div>';

      var csvUrl = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(sheetName) + "&_t=" + Date.now();

      fetch(csvUrl, { cache: "no-store" })
        .then(function(res) { return res.text(); })
        .then(function(text) {
          var lines = text.split(/\r\n|\n/);
          var list = [];

          for (var i = 0; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            var cols = parseCSVLine(lines[i]);

            var colA = cols[0] ? cols[0].replace(/^"|"$/g, '').trim() : '';
            var precioRaw = cols[5] ? cols[5].replace(/^"|"$/g, '').trim() : '0';
            var stockRaw = cols[6] ? cols[6].replace(/^"|"$/g, '').trim().toUpperCase() : 'FALSE';
            
            var talleRaw = '';
            if (sheetName === 'REMERAS' && cols[7]) {
              talleRaw = cols[7].replace(/^"|"$/g, '').trim();
            }

            var img1Raw = cols[8] ? cols[8].replace(/^"|"$/g, '').trim() : '';
            var img2Raw = cols[9] ? cols[9].replace(/^"|"$/g, '').trim() : '';
            var img3Raw = cols[10] ? cols[10].replace(/^"|"$/g, '').trim() : '';

            var imagenesValidas = [];
            var u1 = formatImageUrl(img1Raw, sheetName);
            if (u1) imagenesValidas.push(u1);
            var u2 = formatImageUrl(img2Raw, sheetName);
            if (u2) imagenesValidas.push(u2);
            var u3 = formatImageUrl(img3Raw, sheetName);
            if (u3) imagenesValidas.push(u3);

            if (!colA || 
                colA.toUpperCase().includes('MODELO') || 
                colA.toUpperCase().includes('STOCK DE') || 
                colA.toUpperCase().includes('IMAGEN Y MODELO')) {
              continue;
            }

            var precioNum = Number(precioRaw.replace(/[^0-9]/g, '')) || 0;
            var esDisponible = (stockRaw === 'TRUE' || stockRaw === 'VERDADERO' || stockRaw === 'SI' || stockRaw === '1');

            list.push({
              modelo: colA,
              precio: precioNum,
              disponible: esDisponible,
              talle: talleRaw,
              imagenes: imagenesValidas,
              activeSlide: 0
            });
          }

          if (currentCategory === sheetName) {
            rawProducts = list;
            applyFilters();
          }
        })
        .catch(function(err) {
          document.getElementById('catalog').innerHTML = '<div class="loading">Error al sincronizar con la planilla.</div>';
        });
    }

    loadCategory('GORRAS');
  </script>
</body>
</html>
